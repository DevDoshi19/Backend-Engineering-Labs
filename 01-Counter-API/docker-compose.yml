
services:
  postgres:
    image: postgres:16-alpine
    container_name: counter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: counter_user
      POSTGRES_PASSWORD: counter_password
      POSTGRES_DB: counter_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter_user -d counter_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
